version: '3.8'

services:
  # --- 3. 프론트엔드 (React) 서비스 ---
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # --- 2. 백엔드 (FastAPI) 서비스 ---
  backend:
    build:
      context: ./backend
    container_name: lmm-product-search-backend-1 # (선택) 컨테이너 이름 고정
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./backend:/app
    environment:
      - DB_HOST=db
      - PYTHONUNBUFFERED=1
      # .env 파일의 내용도 여기서 읽어오지만, 명시적으로 적어주면 더 확실함
      - DB_USER=root
      - DB_PASSWORD=12345
      - DB_NAME=lmm_project
    depends_on:
      - db
    # (!!!) [핵심 수정] 이 줄을 반드시 추가하세요!
    # 에러 원인인 'python app/main.py' 대신 uvicorn 모듈 실행 방식을 사용합니다.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- 1. 데이터베이스 (MySQL) 서비스 ---
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: lmm_project
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: