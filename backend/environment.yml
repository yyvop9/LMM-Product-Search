# backend/environment.yml

name: lmm-backend
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # --- 1. Conda로 설치할 핵심 패키지 ---
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pandas
  - pillow
  - tqdm
  - pymysql
  - cryptography
  - pip

  # --- 2. Pip으로 설치할 웹/AI 패키지 ---
  - pip:
    - fastapi
    - uvicorn
    - python-dotenv
    - transformers
    - scikit-learn
    - python-multipart
    - ibm-watsonx-ai  # (!!!) 여기가 핵심입니다 (OpenAI 대신 사용)
    - deep-translator