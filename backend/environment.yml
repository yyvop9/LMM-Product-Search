name: lmm-backend
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # --- 1. Conda로 설치할 핵심 패키지 ---
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pandas
  - pillow
  - tqdm
  - pymysql
  - sqlalchemy
  - cryptography
  - pip

  # --- 2. Pip으로 설치할 웹/AI 패키지 ---
  - pip:
    - fastapi
    - uvicorn
    - python-dotenv
    - transformers
    - scikit-learn
    - python-multipart
    - python-jose[cryptography]
    - passlib[bcrypt]
    - ibm-watsonx-ai
    - deep-translator
    - safetensors  # (!!!) [추가] 모델 로드 필수 라이브러리