name: lmm-backend
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # --- 1. Conda로 설치할 핵심 패키지 ---
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pandas
  - pillow
  - tqdm
  - pymysql
  - sqlalchemy
  - cryptography
  - pip

  # --- 2. Pip으로 설치할 웹/AI 패키지 ---
  - pip:
    - fastapi
    - uvicorn
    - python-dotenv
    - transformers
    - scikit-learn
    - ibm-watsonx-ai
    - deep-translator
    - safetensors
    - requests
    - "python-multipart"
    - "python-jose[cryptography]"
    - "email-validator"
    # [핵심 수정] passlib 호환성을 위해 bcrypt 버전을 4.0.1로 고정합니다.
    - "passlib"
    - "bcrypt==4.0.1"